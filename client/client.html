<!DOCTYPE html>
<html>
  <head>
    <title>Page Title</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <h1>Welcome to ZK-Login</h1>

    <div class="keysContainer">
      <section class="inputKeysSection">
        <div>
          <p>Public key:</p>
          <input type="text" name="publicKey" id="publicKeyInput">
        </div>
        <div>
          <p>Private key:</p>
          <input type="text" name="privateKey" id="privateKeyInput">
        </div>
      </section>
      <section class="btnSection">
        <button id="btnUserLogin">Login</button>
        <button id="btnGetKeys">Get Keys</button>
      </section>
    </div>
  </body>
</html>
