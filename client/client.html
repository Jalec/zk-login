<!DOCTYPE html>
<html>
  <head>
    <title>ZK-Login</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <h1 class="mainTitle">Please, log in. I won't save your password.</h1>
    <div class="mainLayout">
      <div class="keysContainer">
        <section class="inputKeysSection">
          <div>
            <p>Public key:</p>
            <input type="text" name="publicKey" id="publicKeyInput">
          </div>
          <div>
            <p>Private key:</p>
            <input type="password" name="privateKey" id="privateKeyInput">
          </div>
        </section>
        <section class="btnSection">
          <button id="btnUserLogin">Login</button>
          <button id="btnGetKeys">Get Keys</button>
        </section>
      </div>
      <div class="diagramContainer">
        <h2 class="titleDiagram">What is happening behind the scenes?</h2>
        <section>
          DYNAMIC DIAGRAM
        </section>
      </div>
    </div>
    <div id="modalKeys">
      <div class="modalContent">
        <span id="closeModal">&times;</span>
        <p>SOC EN MODAL</p>
      </div>
    </div>
  </body>
</html>
